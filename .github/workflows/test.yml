name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The server's own tests never ran here - the rate-limiter's trusted-proxy
  # parsing in particular decides whose requests share a bucket, so a mistake
  # in it is a security bug, not a broken build.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run server tests
        run: cargo test --workspace

  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Run crypto protocol tests
        working-directory: client
        run: pnpm test
