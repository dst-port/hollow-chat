name: Build Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # GitHub does not bind a *draft* release to its tag, so it will happily hold
  # several drafts sharing one tag name. Letting all three matrix jobs reach
  # tauri-action at once therefore doesn't converge on one release - they race,
  # some create their own, and a platform's artifacts end up on a draft nobody
  # publishes. (v1.0.4 shipped with no Linux builds this way.) Create the
  # release once here and hand every job its id.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) return existing.id;
            const created = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `HollowChat ${tag}`,
              draft: true,
              prerelease: false,
            });
            return created.data.id;
          result-encoding: string

  build:
    needs: [release]
    # `needs` on a job that is itself skipped for non-tag pushes would skip this
    # one too, so allow the skipped case through: a push to main still compiles
    # every platform, it just doesn't publish.
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      # Only actually publishes (and needs a valid, non-empty release) on a
      # `v*` tag push - a plain push to main still builds every platform (so
      # a broken build is caught immediately) but skips release/signing.
      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          # Every platform uploads into this one release, so latest.json is
          # merged across them instead of each job writing its own.
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: true

      # macOS ad-hoc signing is done by the bundler itself via
      # `bundle.macOS.signingIdentity: "-"` in tauri.conf.json, which is what
      # keeps Gatekeeper from calling the app "damaged". A post-hoc `codesign`
      # sweep here would only touch the staged .app after tauri-action has
      # already packaged and uploaded the .dmg/.app.tar.gz, so it changed
      # nothing that ships - removed.

      # --no-bundle: just compile, skip bundling entirely - bundling is
      # where createUpdaterArtifacts kicks in and demands a signing key,
      # which a plain push to main (not cutting a release) doesn't have.
      - name: Build (verify only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: client
        run: pnpm tauri build --no-bundle
