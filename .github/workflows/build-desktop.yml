name: Build Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      # Only actually publishes (and needs a valid, non-empty release) on a
      # `v*` tag push - a plain push to main still builds every platform (so
      # a broken build is caught immediately) but skips release/signing.
      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: HollowChat ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # Ad-hoc signature so macOS doesn't reject the app as "damaged"
      # (Gatekeeper still warns, but with an "Open anyway" button). The
      # signingIdentity: "-" in tauri.conf.json signs the bundle during
      # build; this is a belt-and-suspenders sweep of anything left over.
      - name: Ad-hoc sign (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          find . -name "*.app" -exec codesign --force --deep --sign - {} \;

      # --no-bundle: just compile, skip bundling entirely - bundling is
      # where createUpdaterArtifacts kicks in and demands a signing key,
      # which a plain push to main (not cutting a release) doesn't have.
      - name: Build (verify only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: client
        run: pnpm tauri build --no-bundle
